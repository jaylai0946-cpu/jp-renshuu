name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      # cache 一定要明寫。setup-node v5 會因為 package.json 有 packageManager
      # 欄位而自動開快取，但 v6 把自動快取縮到只剩 npm——拿掉這行的話，
      # 之後升 v6 快取會安靜地失效。
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 測試沒過就不要上線
      - run: pnpm test
      - run: pnpm build

      # 新 repo 第一次部署前，要先到 Settings → Pages 把 Source 設成
      # GitHub Actions。這一步沒辦法自動化：enablement: true 需要的建站
      # 權限 GITHUB_TOKEN 沒有，會回 Resource not accessible by integration。
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
